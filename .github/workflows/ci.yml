name: CI

on:
  pull_request:
  push:
    branches: [main]

# Uma execução por branch/PR: um push novo num PR cancela a anterior ainda em andamento. No main
# NÃO cancela: cada commit mergeado precisa terminar a sua suíte (senão fica sem resultado).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Testes (./mvnw clean test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Os testes sobem o PostgreSQL via Testcontainers (o Docker já vem no runner).
      # Não existe .env no CI: o segredo JWT dos testes está em src/test/resources/config.
      - name: Rodar a suíte completa
        run: ./mvnw -B -ntp clean test

      - name: Guardar relatórios dos testes (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7
