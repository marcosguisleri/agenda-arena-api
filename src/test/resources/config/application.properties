# Configuração só dos testes (carregada além do application.properties principal).
# O segredo abaixo NÃO é usado fora dos testes.
app.security.jwt.secret=test-only-secret-key-with-at-least-32-bytes-0123456789
app.security.jwt.expiration-minutes=60
# Limite de requisições desligado nos testes de regra de negócio (fazem dezenas de requisições do mesmo IP).
# Os testes de limite ligam com @SpringBootTest(properties = ...).
app.rate-limit.enabled=false
# Janela de reserva: limite à frente bem alto para os testes de regra de negócio, que reservam semanas
# adiante. Os limites reais (14 e 30 dias) são testados em BookingWindowIntegrationTests.
app.reservation.max-advance-days=3650
app.reservation.manual-max-past-days=30
# E-mails: o envio fica desligado nos testes e roda no mesmo thread (determinístico).
app.mail.enabled=false
app.mail.async=false
