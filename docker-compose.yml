services:
  postgres:
    image: postgres:17-alpine
    container_name: agenda-arena-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - agenda_arena_postgres_data:/var/lib/postgresql/data

volumes:
  agenda_arena_postgres_data: