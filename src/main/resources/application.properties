spring.application.name=agenda-arena-api

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.security.platform-admin.name=${PLATFORM_ADMIN_NAME:Platform Admin}
app.security.platform-admin.email=${PLATFORM_ADMIN_EMAIL:}
app.security.platform-admin.phone=${PLATFORM_ADMIN_PHONE:00000000000}
app.security.platform-admin.password=${PLATFORM_ADMIN_PASSWORD:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Documentação da API (Swagger UI em /swagger-ui.html). Em produção: API_DOCS_ENABLED=false
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
