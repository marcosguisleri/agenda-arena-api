services:
  postgres:
    image: postgres:17-alpine
    container_name: agenda-arena-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - agenda_arena_postgres_data:/var/lib/postgresql/data

  # Captura os e-mails em desenvolvimento (não envia nada de verdade): http://localhost:8025
  mailpit:
    image: axllent/mailpit
    container_name: agenda-arena-mailpit

    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  agenda_arena_postgres_data: