spring.application.name=agenda-arena-api

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.security.platform-admin.name=${PLATFORM_ADMIN_NAME:Platform Admin}
app.security.platform-admin.email=${PLATFORM_ADMIN_EMAIL:}
app.security.platform-admin.phone=${PLATFORM_ADMIN_PHONE:00000000000}
app.security.platform-admin.password=${PLATFORM_ADMIN_PASSWORD:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# E-mails transacionais. MAIL_ENABLED=false (padrão) só registra no log que não enviou.
# Em desenvolvimento use o Mailpit do docker-compose (SMTP localhost:1025, interface em :8025).
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@agendaarena.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Janela de datas para reservar: online/disponibilidade até N dias à frente; manual retroativa até N dias atrás.
app.reservation.max-advance-days=${RESERVATION_MAX_ADVANCE_DAYS:14}
app.reservation.manual-max-past-days=${RESERVATION_MANUAL_MAX_PAST_DAYS:30}

# Documentação da API (Swagger UI em /swagger-ui.html). Em produção: API_DOCS_ENABLED=false
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
